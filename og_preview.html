<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Bhavya &amp; Sanyam — Open Graph Banner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;1,400;1,600&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Montserrat:wght@400;500;600;700&family=Alex+Brush&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background-color: #3b060d;
      font-family: 'Playfair Display', Georgia, serif;
      -webkit-font-smoothing: antialiased;
    }

    .og-card {
      position: relative;
      width: 1200px;
      height: 630px;
      background: 
        radial-gradient(ellipse at 50% 40%, rgba(122, 23, 39, 0.95) 0%, rgba(67, 9, 18, 0.98) 55%, #2a0308 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 60px;
      color: #F9F0E0;
      text-align: center;
      overflow: hidden;
    }

    /* Ambient Gold Shimmer & Bokeh Circles */
    .ambient-glow-1 {
      position: absolute;
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      width: 800px;
      height: 450px;
      background: radial-gradient(circle, rgba(197, 160, 89, 0.22) 0%, rgba(140, 103, 33, 0.08) 50%, transparent 70%);
      pointer-events: none;
      filter: blur(40px);
    }
    .ambient-glow-2 {
      position: absolute;
      bottom: -60px;
      left: 50%;
      transform: translateX(-50%);
      width: 700px;
      height: 300px;
      background: radial-gradient(circle, rgba(243, 229, 171, 0.15) 0%, rgba(197, 160, 89, 0.05) 50%, transparent 70%);
      pointer-events: none;
      filter: blur(30px);
    }

    /* Outer Royal Borders */
    .outer-border {
      position: absolute;
      top: 22px;
      left: 22px;
      right: 22px;
      bottom: 22px;
      border: 2px solid rgba(212, 175, 55, 0.65);
      border-radius: 12px;
      pointer-events: none;
      box-shadow: 
        inset 0 0 30px rgba(197, 160, 89, 0.12),
        0 0 25px rgba(197, 160, 89, 0.25);
    }
    .inner-border {
      position: absolute;
      top: 30px;
      left: 30px;
      right: 30px;
      bottom: 30px;
      border: 1px solid rgba(243, 229, 171, 0.4);
      border-radius: 8px;
      pointer-events: none;
    }

    /* Ornate Corner Brackets */
    .corner-bracket {
      position: absolute;
      width: 36px;
      height: 36px;
      border-color: #F3E5AB;
      border-style: solid;
      pointer-events: none;
      filter: drop-shadow(0 0 6px rgba(212, 175, 55, 0.7));
    }
    .corner-tl { top: 34px; left: 34px; border-width: 3px 0 0 3px; }
    .corner-tr { top: 34px; right: 34px; border-width: 3px 3px 0 0; }
    .corner-bl { bottom: 34px; left: 34px; border-width: 0 0 3px 3px; }
    .corner-br { bottom: 34px; right: 34px; border-width: 0 3px 3px 0; }

    /* Corner Floral Accents */
    .floral-corner {
      position: absolute;
      width: 170px;
      height: auto;
      opacity: 0.75;
      pointer-events: none;
      filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.6));
    }
    .floral-tl { top: 25px; left: 25px; }
    .floral-tr { top: 25px; right: 25px; transform: scaleX(-1); }

    /* Wax Seal Badge */
    .wax-seal {
      position: absolute;
      bottom: 38px;
      right: 55px;
      width: 90px;
      height: auto;
      filter: drop-shadow(0 8px 20px rgba(0,0,0,0.7));
      transform: rotate(-8deg);
      opacity: 0.92;
    }

    /* Content Area */
    .content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      max-width: 960px;
    }

    /* Ganesh Invocation */
    .ganesh-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 8px;
    }
    .ganesh-flourish {
      width: 140px;
      height: auto;
      opacity: 0.9;
      margin-bottom: 6px;
      filter: drop-shadow(0 2px 8px rgba(212, 175, 55, 0.5));
    }
    .ganesh-text {
      font-family: 'Cinzel', serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: #F3E5AB;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8), 0 0 12px rgba(243, 229, 171, 0.4);
    }
    .celebration-label {
      font-family: 'Montserrat', sans-serif;
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #dfbf80;
      margin-top: 3px;
    }

    /* Couple Names */
    .couple-title-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 22px;
      margin: 12px 0 10px 0;
    }
    .couple-name {
      font-family: 'Cinzel', serif;
      font-size: 68px;
      font-weight: 800;
      letter-spacing: 0.04em;
      background: linear-gradient(135deg, #FFFFFF 0%, #FFF3D1 25%, #F3E5AB 50%, #C5A059 75%, #D4AF37 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 14px rgba(0, 0, 0, 0.9)) drop-shadow(0 0 18px rgba(243, 229, 171, 0.35));
      line-height: 1.1;
    }
    .ampersand {
      font-family: 'Alex Brush', cursive;
      font-size: 76px;
      color: #F3E5AB;
      line-height: 0.8;
      text-shadow: 0 4px 15px rgba(0, 0, 0, 0.9), 0 0 20px rgba(212, 175, 55, 0.6);
      transform: translateY(-4px);
    }

    /* Gold Divider */
    .divider-img {
      width: 260px;
      height: auto;
      margin: 4px 0 14px 0;
      opacity: 0.95;
      filter: drop-shadow(0 2px 8px rgba(212, 175, 55, 0.5));
    }

    /* Sacred Tagline */
    .sacred-tagline {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-size: 21px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: #FFF3D1;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
      margin-bottom: 20px;
    }

    /* Details Pill / Badges */
    .details-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-top: 4px;
    }
    .badge {
      display: flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, rgba(80, 15, 25, 0.75) 0%, rgba(45, 5, 10, 0.85) 100%);
      border: 1.5px solid rgba(212, 175, 55, 0.55);
      border-radius: 50px;
      padding: 10px 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(243, 229, 171, 0.3);
    }
    .badge-icon {
      color: #F3E5AB;
      font-size: 14px;
    }
    .badge-text {
      font-family: 'Montserrat', sans-serif;
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #FFFFFF;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
    }
    .badge-highlight {
      color: #F3E5AB;
      font-weight: 700;
    }

    .badge-separator {
      color: rgba(212, 175, 55, 0.6);
      font-size: 18px;
    }

    /* Gold Sparkle Dots */
    .sparkle {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background-color: #FFF3D1;
      box-shadow: 0 0 8px 2px rgba(243, 229, 171, 0.9);
      pointer-events: none;
    }
    .sp-1 { top: 120px; left: 180px; width: 5px; height: 5px; }
    .sp-2 { top: 160px; right: 200px; width: 6px; height: 6px; }
    .sp-3 { bottom: 140px; left: 220px; width: 4px; height: 4px; }
    .sp-4 { bottom: 120px; right: 260px; width: 5px; height: 5px; }
    .sp-5 { top: 80px; left: 450px; width: 3px; height: 3px; }
    .sp-6 { top: 90px; right: 420px; width: 4px; height: 4px; }
  </style>
</head>
<body>

  <div class="og-card">
    <!-- Ambient Lighting -->
    <div class="ambient-glow-1"></div>
    <div class="ambient-glow-2"></div>

    <!-- Outer & Inner Golden Borders -->
    <div class="outer-border"></div>
    <div class="inner-border"></div>

    <!-- Ornate Corners -->
    <div class="corner-bracket corner-tl"></div>
    <div class="corner-bracket corner-tr"></div>
    <div class="corner-bracket corner-bl"></div>
    <div class="corner-bracket corner-br"></div>

    <!-- Floral Corner Accents -->
    <img class="floral-corner floral-tl" src="images/cdn/noroot_3.png" alt="" />
    <img class="floral-corner floral-tr" src="images/cdn/noroot_2.png" alt="" />

    <!-- Wax Seal Accent -->
    <img class="wax-seal" src="images/cdn/wax_seal_1.png" alt="Royal Wax Seal" />

    <!-- Sparkles -->
    <div class="sparkle sp-1"></div>
    <div class="sparkle sp-2"></div>
    <div class="sparkle sp-3"></div>
    <div class="sparkle sp-4"></div>
    <div class="sparkle sp-5"></div>
    <div class="sparkle sp-6"></div>

    <!-- Main Banner Content -->
    <div class="content">
      <div class="ganesh-wrap">
        <img class="ganesh-flourish" src="images/cdn/noroot_6.png" alt="" />
        <div class="ganesh-text">Shree Ganeshaya Namah</div>
        <div class="celebration-label">The Royal Wedding Celebration Of</div>
      </div>

      <div class="couple-title-row">
        <div class="couple-name">Bhavya</div>
        <div class="ampersand">&amp;</div>
        <div class="couple-name">Sanyam</div>
      </div>

      <img class="divider-img" src="images/cdn/noroot_6.png" alt="" />

      <div class="sacred-tagline">
        Two Souls • Seven Sacred Vows • One Eternal Journey
      </div>

      <div class="details-container">
        <div class="badge">
          <span class="badge-icon">✦</span>
          <span class="badge-text"><span class="badge-highlight">Thursday, 26 Nov 2026</span></span>
        </div>
        <span class="badge-separator">❖</span>
        <div class="badge">
          <span class="badge-icon">✦</span>
          <span class="badge-text"><span class="badge-highlight">Crossroads Banquets</span></span>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
